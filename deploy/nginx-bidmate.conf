# nginx 설정. 서버 경로: /etc/nginx/sites-available/bidmate
# /api/… → 백엔드(127.0.0.1:8000), 나머지 → 프론트 빌드 파일(/var/www/bidmate, frontend-react 의 dist)
# 인증서: certbot(Let's Encrypt)이 /etc/letsencrypt 에 발급·자동 갱신

server {
    listen 80;
    server_name 211-233-216-208.sslip.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name 211-233-216-208.sslip.io;

    ssl_certificate /etc/letsencrypt/live/211-233-216-208.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/211-233-216-208.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 21m;  # 기준서 업로드 최대 20MB

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 프론트 화면 (React 라우터: 없는 경로는 index.html 로)
    root /var/www/bidmate;
    location / {
        try_files $uri $uri/ /index.html;
    }
}
