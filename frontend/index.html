<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>입찰메이트 · 한전 입찰 공고</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <span class="brand">입찰메이트</span>
      <span class="demo-label">한전 공식 API·SRM 수집 데이터</span>
    </div>
  </header>

  <main class="wrap">
    <h1>한전 입찰 공고</h1>
    <p class="lead">한전 공사·용역 중 적격심사 공고입니다. 업체 조건과 맞춰 본 결과가 아닙니다.</p>
    <div class="toolbar">
      <label class="toggle"><input id="include-closed" type="checkbox"> 마감된 공고 포함</label>
      <span id="last-run" class="meta"></span>
    </div>
    <p id="status" role="status">공고를 불러오는 중입니다.</p>

    <div id="workspace" class="workspace" hidden>
      <section class="panel notice-list" aria-labelledby="list-title">
        <h2 id="list-title">공고 목록 <span id="notice-count" class="count"></span></h2>
        <ul id="notices"></ul>
      </section>

      <article id="detail" class="panel detail" aria-labelledby="notice-title">
        <header class="notice-header">
          <p id="notice-meta" class="meta"></p>
          <h2 id="notice-title"></h2>
        </header>
        <section class="detail-section" aria-labelledby="basic-title">
          <h3 id="basic-title">기본 정보 <span class="source">공식 API</span></h3>
          <dl id="basic" class="summary"></dl>
        </section>
        <section class="detail-section" aria-labelledby="license-title">
          <h3 id="license-title">면허 조건 <span class="source">SRM 투찰제한</span></h3>
          <div id="license" class="conditions"></div>
        </section>
        <section class="detail-section" aria-labelledby="qualification-title">
          <h3 id="qualification-title">적격자격 조건 <span class="source">SRM 투찰제한</span></h3>
          <div id="qualification" class="conditions"></div>
        </section>
        <section class="detail-section" aria-labelledby="srm-title">
          <h3 id="srm-title">SRM 상세 <span id="detail-status" class="tag"></span></h3>
          <dl id="srm" class="summary"></dl>
        </section>
      </article>
    </div>
  </main>

  <footer class="wrap">
    참고용 서비스이며 법적 효력이 없습니다. 최종 확인은 공고 원문과 발주처 기준에 따릅니다.
  </footer>
</body>
</html>
